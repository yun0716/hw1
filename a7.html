<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#160d27">
    <title>BLOCK PARTY｜打磚塊</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #fff7e8;
            --muted: #b7a9c6;
            --panel: #241532;
            --pink: #ff4f91;
            --cyan: #55f0dc;
            --yellow: #ffe46b;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 26px 20px 22px;
            color: var(--ink);
            background-color: #160d27;
            background-image: radial-gradient(ellipse at 50% 0%, #452039 0%, transparent 52%), radial-gradient(#ffffff12 0.7px, transparent 0.7px);
            background-size: auto, 18px 18px;
            font-family: "Trebuchet MS", "Microsoft JhengHei", sans-serif;
        }
        button { color: inherit; font: inherit; }
        .arcade { width: min(100%, 1000px); margin: 0 auto; }
        .masthead { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 4px 15px; }
        .eyebrow { margin: 0 0 5px; color: var(--cyan); font-size: 11px; font-weight: 900; letter-spacing: 2.5px; }
        h1 { margin: 0; color: var(--ink); font-size: clamp(25px, 5vw, 42px); line-height: 1; text-shadow: 3px 3px 0 #ff4f91, 6px 6px 0 #6d3170; }
        h1 span { color: var(--yellow); }
        .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
        .toolbar { display: flex; gap: 8px; }
        .icon-button, .start-button, .touch-controls button { border: 1px solid #ffffff30; cursor: pointer; }
        .icon-button { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 12px; background: #30203d; font-size: 18px; }
        .icon-button:hover { border-color: var(--cyan); background: #3d2850; }
        .scorebar { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 10px; border: 1px solid #ffffff24; border-radius: 12px; background: #241532e8; box-shadow: 0 8px 22px #09051255; }
        .stat { padding: 10px 16px; }
        .stat + .stat { border-left: 1px solid #ffffff1a; }
        .stat-label { display: block; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: 1.4px; }
        .stat-value { display: block; margin-top: 2px; color: var(--yellow); font-size: 21px; font-weight: 900; font-variant-numeric: tabular-nums; }
        .stage { position: relative; overflow: hidden; border: 2px solid #ffffff35; border-radius: 15px; background: #171126; box-shadow: 0 7px 0 #0b0714, 0 20px 45px #08051088, 0 0 34px #ff4f9120; }
        canvas { display: block; width: 100%; aspect-ratio: 16 / 9; touch-action: none; }
        .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; background: #130c20c9; backdrop-filter: blur(5px); text-align: center; }
        .overlay.hidden { display: none; }
        .overlay-content { max-width: 360px; }
        .overlay h2 { margin: 0 0 8px; color: var(--yellow); font-size: clamp(28px, 6vw, 48px); text-shadow: 3px 3px 0 #e84989; }
        .overlay p { margin: 0 0 20px; color: #f0e5f2; line-height: 1.6; }
        .start-button { padding: 12px 25px; border: 0; border-radius: 10px; color: #210e25; background: var(--cyan); box-shadow: 0 5px 0 #269e9d; font-weight: 900; letter-spacing: .5px; }
        .start-button:hover { transform: translateY(-1px); filter: brightness(1.08); }
        .footnote { display: flex; justify-content: space-between; gap: 12px; margin: 12px 4px 0; color: var(--muted); font-size: 12px; }
        .footnote strong { color: var(--cyan); }
        .touch-controls { display: none; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .touch-controls button { min-height: 48px; border-radius: 10px; background: #30203d; font-weight: 800; touch-action: none; }
        .touch-controls button:active { border-color: var(--cyan); background: #49305a; }
        @media (pointer: coarse) { .touch-controls { display: grid; } }
        @media (max-width: 560px) {
            body { padding: 18px 12px; }
            .masthead { align-items: center; }
            .subtitle { font-size: 11px; }
            .scorebar { margin-bottom: 8px; }
            .stat { padding: 8px 10px; }
            .stat-value { font-size: 18px; }
            .stage { border-radius: 10px; }
            .footnote { font-size: 11px; }
        }
    </style>
</head>
<body>
<main class="arcade">
    <header class="masthead">
        <div>
            <p class="eyebrow">ONE BALL. ALL THE BRICKS.</p>
            <h1>BLOCK <span>PARTY</span></h1>
            <p class="subtitle">打開音效，來場彈跳派對。</p>
        </div>
        <div class="toolbar">
            <button class="icon-button" id="sound" type="button" aria-label="關閉音效" title="關閉音效">♫</button>
            <button class="icon-button" id="pause" type="button" aria-label="暫停遊戲" title="暫停遊戲">Ⅱ</button>
        </div>
    </header>
    <section class="scorebar" aria-label="遊戲資訊">
        <div class="stat"><span class="stat-label">SCORE</span><span class="stat-value" id="score">00000</span></div>
        <div class="stat"><span class="stat-label">LIVES</span><span class="stat-value" id="lives">♥ ♥ ♥</span></div>
        <div class="stat"><span class="stat-label">LEVEL</span><span class="stat-value" id="level">01</span></div>
    </section>
    <section class="stage" aria-label="打磚塊遊戲區">
        <canvas id="game" aria-label="打磚塊遊戲畫面"></canvas>
        <div class="overlay" id="overlay">
            <div class="overlay-content">
                <h2 id="overlay-title">準備開打？</h2>
                <p id="overlay-copy">移動球拍接住彈球，把所有磚塊通通打掉！</p>
                <button class="start-button" id="start" type="button">開始遊戲　→</button>
            </div>
        </div>
    </section>
    <div class="footnote"><span>操作 <strong>← →</strong> / <strong>A D</strong> 或移動滑鼠</span><span>空白鍵暫停</span></div>
    <div class="touch-controls"><button type="button" data-move="-1">←　左移</button><button type="button" data-move="1">右移　→</button></div>
</main>
<script>
(() => {
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const overlay = document.querySelector('#overlay');
    const startButton = document.querySelector('#start');
    const scoreElement = document.querySelector('#score');
    const livesElement = document.querySelector('#lives');
    const levelElement = document.querySelector('#level');
    const soundButton = document.querySelector('#sound');
    const pauseButton = document.querySelector('#pause');
    const colors = ['#ff5470', '#ff9252', '#ffd34f', '#9de04e', '#42dfc2', '#43a9ff', '#a779ff'];
    const brickRows = 5;
    let width = 0, height = 0, dpr = 1, paddle, ball, bricks = [];
    let score = 0, lives = 3, level = 1, running = false, paused = false, muted = false, audio;
    let lastTime = 0, particles = [], paddleDirection = 0;
    const keys = {};

    function resize() {
        const rect = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width;
        height = rect.height;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (paddle) paddle.x = Math.max(paddle.width / 2, Math.min(width - paddle.width / 2, paddle.x));
        if (!running) draw();
    }

    function tone(frequency, duration, type = 'sine', volume = .045, slide = 0) {
        if (muted) return;
        try {
            audio ||= new (window.AudioContext || window.webkitAudioContext)();
            if (audio.state === 'suspended') audio.resume();
            const oscillator = audio.createOscillator();
            const gain = audio.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audio.currentTime);
            if (slide) oscillator.frequency.exponentialRampToValueAtTime(Math.max(50, frequency + slide), audio.currentTime + duration);
            gain.gain.setValueAtTime(volume, audio.currentTime);
            gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);
            oscillator.connect(gain);
            gain.connect(audio.destination);
            oscillator.start();
            oscillator.stop(audio.currentTime + duration);
        } catch (_) {}
    }

    function makeBricks() {
        const columns = 9;
        const gap = Math.max(5, width * .009);
        const side = Math.max(3, Math.min(7, width * .008));
        const margin = width * .07;
        const brickWidth = (width - margin * 2 - gap * (columns - 1)) / columns;
        const brickHeight = Math.max(15, Math.min(24, height * .043));
        bricks = [];
        for (let row = 0; row < brickRows; row++) {
            for (let column = 0; column < columns; column++) {
                bricks.push({ x: margin + column * (brickWidth + gap), y: height * .13 + row * (brickHeight + gap + side), w: brickWidth, h: brickHeight, side, color: colors[(row + level - 1) % colors.length], alive: true });
            }
        }
    }

    function resetBall() {
        paddle = { x: width / 2, y: height * .88, width: Math.max(74, width * .12), height: 13 };
        ball = { x: width / 2, y: paddle.y - 17, radius: Math.max(6, width * .009), vx: 175 + level * 12, vy: -(220 + level * 14) };
    }

    function updateHud() {
        scoreElement.textContent = String(score).padStart(5, '0');
        livesElement.textContent = Array.from({ length: 3 }, (_, i) => i < lives ? '♥' : '♡').join(' ');
        levelElement.textContent = String(level).padStart(2, '0');
    }

    function startGame() {
        score = 0;
        lives = 3;
        level = 1;
        particles = [];
        makeBricks();
        resetBall();
        updateHud();
        running = true;
        paused = false;
        pauseButton.textContent = 'Ⅱ';
        overlay.classList.add('hidden');
        lastTime = performance.now();
        requestAnimationFrame(loop);
        tone(520, .12, 'triangle', .04, 360);
    }

    function togglePause() {
        if (!running) return;
        paused = !paused;
        pauseButton.textContent = paused ? '▶' : 'Ⅱ';
        if (paused) {
            overlayTitle('暫停一下', '喝口水，派對等你回來。', '繼續遊戲　→');
            overlay.classList.remove('hidden');
        } else {
            overlay.classList.add('hidden');
            lastTime = performance.now();
            requestAnimationFrame(loop);
        }
    }

    function overlayTitle(title, copy, buttonText) {
        document.querySelector('#overlay-title').textContent = title;
        document.querySelector('#overlay-copy').textContent = copy;
        startButton.textContent = buttonText;
    }

    function finishGame(won) {
        running = false;
        paused = false;
        pauseButton.textContent = 'Ⅱ';
        overlayTitle(won ? '漂亮！過關！' : '球球落地了', `最終分數 ${String(score).padStart(5, '0')}　再玩一場？`, '再玩一次　↻');
        overlay.classList.remove('hidden');
        tone(won ? 740 : 180, .42, won ? 'triangle' : 'sawtooth', .06, won ? 420 : -100);
    }

    function burst(x, y, color) {
        for (let i = 0; i < 9; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 45 + Math.random() * 145;
            particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: .42, color });
        }
    }

    function update(dt) {
        const direction = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0) || paddleDirection;
        paddle.x = Math.max(paddle.width / 2, Math.min(width - paddle.width / 2, paddle.x + direction * 440 * dt));
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx = Math.abs(ball.vx); tone(270, .045, 'sine', .018); }
        if (ball.x + ball.radius > width) { ball.x = width - ball.radius; ball.vx = -Math.abs(ball.vx); tone(270, .045, 'sine', .018); }
        if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy = Math.abs(ball.vy); tone(320, .045, 'sine', .018); }

        if (ball.vy > 0 && ball.y + ball.radius >= paddle.y && ball.y - ball.radius <= paddle.y + paddle.height && ball.x >= paddle.x - paddle.width / 2 && ball.x <= paddle.x + paddle.width / 2) {
            const hit = (ball.x - paddle.x) / (paddle.width / 2);
            const speed = Math.min(500, Math.hypot(ball.vx, ball.vy) * 1.015);
            const angle = hit * .95;
            ball.vx = Math.sin(angle) * speed;
            ball.vy = -Math.cos(angle) * speed;
            ball.y = paddle.y - ball.radius;
            tone(410 + Math.abs(hit) * 200, .08, 'triangle', .04);
        }

        for (const brick of bricks) {
            if (!brick.alive) continue;
            const nearestX = Math.max(brick.x, Math.min(ball.x, brick.x + brick.w));
            const nearestY = Math.max(brick.y, Math.min(ball.y, brick.y + brick.h));
            if (Math.hypot(ball.x - nearestX, ball.y - nearestY) < ball.radius) {
                brick.alive = false;
                if (Math.abs(ball.x - nearestX) > Math.abs(ball.y - nearestY)) ball.vx *= -1;
                else ball.vy *= -1;
                score += 10 * level;
                updateHud();
                burst(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color);
                tone(340 + (brick.y / height) * 470, .1, 'sine', .035, 150);
                break;
            }
        }

        if (ball.y - ball.radius > height) {
            lives--;
            updateHud();
            tone(155, .25, 'sawtooth', .05, -75);
            if (lives <= 0) { finishGame(false); return; }
            resetBall();
        }
        if (bricks.every(brick => !brick.alive)) {
            level++;
            if (level > 9) { finishGame(true); return; }
            makeBricks();
            resetBall();
            updateHud();
            tone(620, .24, 'triangle', .05, 300);
        }
        particles.forEach(particle => { particle.x += particle.vx * dt; particle.y += particle.vy * dt; particle.life -= dt; });
        particles = particles.filter(particle => particle.life > 0);
    }

    function roundedRect(x, y, w, h, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
    }

    function drawBrick(brick) {
        if (!brick.alive) return;
        const { x, y, w, h, side, color } = brick;
        ctx.fillStyle = '#090713';
        roundedRect(x + 2, y + side + 2, w + side, h + side, 4);
        ctx.fill();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x + 3, y + h);
        ctx.lineTo(x + w, y + h);
        ctx.lineTo(x + w + side, y + h + side);
        ctx.lineTo(x + side, y + h + side);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x + w, y + 3);
        ctx.lineTo(x + w + side, y + side + 3);
        ctx.lineTo(x + w + side, y + h + side);
        ctx.lineTo(x + w, y + h);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.globalAlpha = .72;
        ctx.fill();
        ctx.globalAlpha = 1;
        const gradient = ctx.createLinearGradient(x, y, x, y + h);
        gradient.addColorStop(0, '#ffffffa8');
        gradient.addColorStop(.22, color);
        gradient.addColorStop(1, color);
        ctx.fillStyle = gradient;
        roundedRect(x, y, w, h, 4);
        ctx.fill();
        ctx.fillStyle = '#ffffff52';
        roundedRect(x + 4, y + 3, Math.max(5, w * .24), 2, 1);
        ctx.fill();
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#171126';
        ctx.fillRect(0, 0, width, height);
        const glow = ctx.createRadialGradient(width / 2, height * .45, 20, width / 2, height * .45, height * .8);
        glow.addColorStop(0, '#382044');
        glow.addColorStop(1, '#171126');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);
        ctx.strokeStyle = '#ffffff0b';
        ctx.lineWidth = 1;
        for (let x = 0; x < width; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke(); }
        for (let y = 0; y < height; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke(); }
        bricks.forEach(drawBrick);

        if (paddle) {
            ctx.shadowColor = '#55f0dc';
            ctx.shadowBlur = 17;
            const gradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(.28, '#75fff0');
            gradient.addColorStop(1, '#19bdbb');
            ctx.fillStyle = gradient;
            roundedRect(paddle.x - paddle.width / 2, paddle.y, paddle.width, paddle.height, 7);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        if (ball) {
            ctx.shadowColor = '#ffe46b';
            ctx.shadowBlur = 18;
            const ballGradient = ctx.createRadialGradient(ball.x - ball.radius * .35, ball.y - ball.radius * .4, 1, ball.x, ball.y, ball.radius * 1.3);
            ballGradient.addColorStop(0, '#fffef3');
            ballGradient.addColorStop(.45, '#ffe46b');
            ballGradient.addColorStop(1, '#ff944f');
            ctx.fillStyle = ballGradient;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        particles.forEach(particle => {
            ctx.globalAlpha = Math.max(0, particle.life / .42);
            ctx.fillStyle = particle.color;
            ctx.fillRect(particle.x, particle.y, 3, 3);
        });
        ctx.globalAlpha = 1;
    }

    function loop(now) {
        if (!running || paused) return;
        const dt = Math.min((now - lastTime) / 1000, .03);
        lastTime = now;
        update(dt);
        draw();
        if (running && !paused) requestAnimationFrame(loop);
    }

    function movePaddle(event) {
        const rect = canvas.getBoundingClientRect();
        paddle.x = Math.max(paddle.width / 2, Math.min(width - paddle.width / 2, (event.clientX - rect.left) * width / rect.width));
    }

    document.addEventListener('keydown', event => {
        if (['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
        keys[event.key] = true;
        if (event.key === ' ' && !event.repeat) togglePause();
    });
    document.addEventListener('keyup', event => { keys[event.key] = false; });
    canvas.addEventListener('pointermove', movePaddle);
    canvas.addEventListener('pointerdown', movePaddle);
    document.querySelectorAll('[data-move]').forEach(button => {
        const direction = Number(button.dataset.move);
        button.addEventListener('pointerdown', event => { event.preventDefault(); paddleDirection = direction; button.setPointerCapture(event.pointerId); });
        ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => button.addEventListener(type, () => { paddleDirection = 0; }));
    });
    startButton.addEventListener('click', () => paused ? togglePause() : startGame());
    pauseButton.addEventListener('click', togglePause);
    soundButton.addEventListener('click', () => {
        muted = !muted;
        soundButton.textContent = muted ? '♫̸' : '♫';
        soundButton.setAttribute('aria-label', muted ? '開啟音效' : '關閉音效');
        soundButton.title = muted ? '開啟音效' : '關閉音效';
        if (!muted) tone(660, .1);
    });
    window.addEventListener('resize', resize);
    resize();
    makeBricks();
    resetBall();
    draw();
})();
</script>
</body>
</html>
