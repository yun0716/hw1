<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星際防衛戰</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #eaf6ff; background: radial-gradient(ellipse at 50% 30%, #102854 0, #080d23 55%, #030610 100%); font-family: system-ui, sans-serif; }
        .game { width: min(94vw, 780px); }
        header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 4px; }
        h1 { margin: 0; color: #74e6ff; font-size: clamp(20px, 4vw, 30px); letter-spacing: 3px; text-shadow: 0 0 16px #23b9ff; }
        .stats { display: flex; gap: 16px; font-weight: 700; }
        .stats span { color: #75e8ff; }
        button { cursor: pointer; }
        #sound { border: 1px solid #5a93bd; border-radius: 20px; padding: 7px 12px; color: white; background: #102443; }
        .stage { position: relative; border: 1px solid #3174a8; border-radius: 12px; overflow: hidden; box-shadow: 0 0 35px #1389cb38; background: #050b1b; }
        canvas { display: block; width: 100%; height: min(68vh, 600px); min-height: 360px; }
        #overlay { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 20px; background: #03091dbd; }
        #overlay.hidden { display: none; }
        #overlay h2 { margin: 0 0 8px; color: #8bedff; font-size: clamp(26px, 6vw, 44px); text-shadow: 0 0 16px #00baff; }
        #overlay p { margin: 5px 0 20px; color: #d1e5ff; }
        #start { padding: 12px 28px; border: 0; border-radius: 24px; color: #061326; background: linear-gradient(90deg, #67f2ff, #64a9ff); font-size: 17px; font-weight: 800; box-shadow: 0 0 20px #4bcfff80; }
        .help { margin: 10px 4px; color: #9db5d1; text-align: center; font-size: 13px; }
        .touch { display: none; justify-content: space-between; margin-top: 8px; }
        .touch button { width: 31%; height: 45px; border: 1px solid #4583b1; border-radius: 10px; color: white; background: #142d4eaa; font-size: 18px; touch-action: none; }
        @media (pointer: coarse) { .touch { display: flex; } }
    </style>
</head>
<body>
<main class="game">
    <header>
        <h1>✦ 星際防衛戰 ✦</h1>
        <div class="stats"><div>分數 <span id="score">0</span></div><div>生命 <span id="lives">♥♥♥</span></div></div>
        <button id="sound" type="button">🔊 音效開</button>
    </header>
    <section class="stage" aria-label="太空射擊遊戲">
        <canvas id="game" aria-label="遊戲畫面"></canvas>
        <div id="overlay"><h2>準備出擊！</h2><p>擊落敵機，守護銀河。</p><button id="start" type="button">開始遊戲</button></div>
    </section>
    <div class="help">移動：← → 或 A / D　｜　射擊：空白鍵</div>
    <div class="touch"><button data-move="-1">◀ 左移</button><button data-fire>🔥 射擊</button><button data-move="1">右移 ▶</button></div>
</main>
<script>
(() => {
    const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
    const overlay = document.querySelector('#overlay'), startBtn = document.querySelector('#start');
    const scoreEl = document.querySelector('#score'), livesEl = document.querySelector('#lives'), soundBtn = document.querySelector('#sound');
    let w, h, player, bullets = [], enemies = [], stars = [], particles = [], score = 0, lives = 3;
    let running = false, last = 0, spawn = 0, shotTimer = 0, muted = false, audio;
    const keys = {}, touch = { left: false, right: false, fire: false };
    function resize() {
        const rect = canvas.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
        w = rect.width; h = rect.height; canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (player) player.x = Math.min(w - 20, Math.max(20, player.x));
        stars = Array.from({ length: Math.floor(w * h / 2500) }, () => ({ x: Math.random() * w, y: Math.random() * h, s: Math.random() * 1.8 + .3, v: Math.random() * 35 + 15 }));
    }
    function beep(freq, duration, type = 'sine', volume = .06, slide = 0) {
        if (muted) return;
        try {
            audio ||= new (window.AudioContext || window.webkitAudioContext)();
            if (audio.state === 'suspended') audio.resume();
            const osc = audio.createOscillator(), gain = audio.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, audio.currentTime);
            if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), audio.currentTime + duration);
            gain.gain.setValueAtTime(volume, audio.currentTime); gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);
            osc.connect(gain); gain.connect(audio.destination); osc.start(); osc.stop(audio.currentTime + duration);
        } catch (_) {}
    }
    function updateLives() { livesEl.textContent = '♥'.repeat(lives) + '♡'.repeat(3 - lives); }
    function reset() {
        score = 0; lives = 3; bullets = []; enemies = []; particles = []; player = { x: w / 2, y: h - 52, invulnerable: 0 };
        scoreEl.textContent = score; updateLives(); spawn = 0; shotTimer = 0; running = true;
        overlay.classList.add('hidden'); last = performance.now(); requestAnimationFrame(loop);
    }
    function fire() { bullets.push({ x: player.x, y: player.y - 17, v: 430 }); beep(620, .09, 'square', .025, 280); }
    function burst(x, y, color) {
        for (let i = 0; i < 12; i++) { const a = Math.random() * Math.PI * 2, speed = Math.random() * 130 + 35; particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: .45, color }); }
    }
    function endGame() {
        running = false; beep(170, .5, 'sawtooth', .07, -110);
        overlay.querySelector('h2').textContent = '任務結束'; overlay.querySelector('p').textContent = `最終得分：${score}　再挑戰一次嗎？`;
        startBtn.textContent = '重新開始'; overlay.classList.remove('hidden');
    }
    function loop(now) { if (!running) return; const dt = Math.min((now - last) / 1000, .035); last = now; update(dt); draw(); requestAnimationFrame(loop); }
    function update(dt) {
        stars.forEach(s => { s.y += s.v * dt; if (s.y > h) { s.y = 0; s.x = Math.random() * w; } });
        const right = keys.ArrowRight || keys.d || keys.D || touch.right, left = keys.ArrowLeft || keys.a || keys.A || touch.left;
        player.x = Math.max(20, Math.min(w - 20, player.x + ((right ? 1 : 0) - (left ? 1 : 0)) * 310 * dt));
        player.invulnerable = Math.max(0, player.invulnerable - dt); shotTimer -= dt;
        if ((keys[' '] || touch.fire) && shotTimer <= 0) { fire(); shotTimer = .22; }
        bullets.forEach(b => b.y -= b.v * dt); bullets = bullets.filter(b => b.y > -10);
        spawn -= dt;
        if (spawn <= 0) { enemies.push({ x: 24 + Math.random() * (w - 48), y: -25, r: 15, v: 85 + Math.random() * 65 + score * .12 }); spawn = Math.max(.38, .95 - score * .003) * (.65 + Math.random() * .7); }
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i]; e.y += e.v * dt;
            for (let j = bullets.length - 1; j >= 0; j--) if (Math.hypot(e.x - bullets[j].x, e.y - bullets[j].y) < e.r + 5) {
                enemies.splice(i, 1); bullets.splice(j, 1); score += 10; scoreEl.textContent = score; burst(e.x, e.y, '#ffae58'); beep(180, .12, 'triangle', .045, -90); break;
            }
            if (!enemies[i]) continue;
            if (e.y > h + 20) { enemies.splice(i, 1); continue; }
            if (player.invulnerable <= 0 && Math.hypot(e.x - player.x, e.y - player.y) < e.r + 12) {
                enemies.splice(i, 1); lives--; updateLives(); player.invulnerable = 1.1; burst(player.x, player.y, '#62deff'); beep(120, .28, 'sawtooth', .08, -65);
                if (lives <= 0) endGame();
            }
        }
        particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }); particles = particles.filter(p => p.life > 0);
    }
    function draw() {
        ctx.clearRect(0, 0, w, h);
        stars.forEach(s => { ctx.fillStyle = `rgba(185,220,255,${.3 + s.s / 3})`; ctx.fillRect(s.x, s.y, s.s, s.s * 2); });
        bullets.forEach(b => { ctx.shadowColor = '#69f6ff'; ctx.shadowBlur = 12; ctx.fillStyle = '#caffff'; ctx.fillRect(b.x - 2, b.y - 10, 4, 13); }); ctx.shadowBlur = 0;
        enemies.forEach(e => { ctx.save(); ctx.translate(e.x, e.y); ctx.fillStyle = '#ff6f79'; ctx.shadowColor = '#ff395b'; ctx.shadowBlur = 13; ctx.beginPath(); ctx.moveTo(0, 17); ctx.lineTo(-15, -10); ctx.lineTo(0, -5); ctx.lineTo(15, -10); ctx.closePath(); ctx.fill(); ctx.restore(); });
        if (player && (player.invulnerable <= 0 || Math.floor(player.invulnerable * 12) % 2 === 0)) {
            ctx.save(); ctx.translate(player.x, player.y); ctx.shadowColor = '#39dfff'; ctx.shadowBlur = 18; ctx.fillStyle = '#62ddff';
            ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-17, 14); ctx.lineTo(0, 8); ctx.lineTo(17, 14); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#fff4a8'; ctx.beginPath(); ctx.moveTo(-5, 12); ctx.lineTo(0, 24 + Math.random() * 6); ctx.lineTo(5, 12); ctx.fill(); ctx.restore();
        }
        particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / .45); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); }); ctx.globalAlpha = 1;
    }
    document.addEventListener('keydown', e => { if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault(); keys[e.key] = true; });
    document.addEventListener('keyup', e => { keys[e.key] = false; });
    document.querySelectorAll('[data-move]').forEach(btn => {
        const side = Number(btn.dataset.move) < 0 ? 'left' : 'right';
        btn.addEventListener('pointerdown', e => { e.preventDefault(); touch[side] = true; btn.setPointerCapture(e.pointerId); });
        ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => btn.addEventListener(type, () => touch[side] = false));
    });
    const fireBtn = document.querySelector('[data-fire]');
    fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); touch.fire = true; fireBtn.setPointerCapture(e.pointerId); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => fireBtn.addEventListener(type, () => touch.fire = false));
    startBtn.addEventListener('click', reset);
    soundBtn.addEventListener('click', () => { muted = !muted; soundBtn.textContent = muted ? '🔇 音效關' : '🔊 音效開'; if (!muted) beep(660, .1); });
    window.addEventListener('resize', resize); resize(); draw();
})();
</script>
</body>
</html>
